
name: Build GREEN KISAN GOLD RELEASE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/greenkisangold/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GreenKisanGold"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.greenkisangold.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.greenkisangold.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="GREEN KISAN GOLD"
                  android:icon="@drawable/ic_logo"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#C9A646</item>
                  <item name="android:statusBarColor">#063B25</item>
                  <item name="android:navigationBarColor">#063B25</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#063B25"
                  android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F5D46A"
                  android:pathData="M54,12a42,42 0,1 0,0.1 0z"/>
              <path android:fillColor="#063B25"
                  android:pathData="M54,20a34,34 0,1 0,0.1 0z"/>
              <path android:fillColor="#6CBF58"
                  android:pathData="M54,75 C20,65 29,35 54,35 C79,35 88,65 54,75 Z"/>
              <path android:fillColor="#F5D46A"
                  android:pathData="M54,75 C50,56 51,44 54,35 C58,49 59,61 54,75 Z"/>
              <path android:fillColor="#F5D46A"
                  android:pathData="M53,76 L55,76 L55,91 L53,91 Z"/>
          </vector>
          EOF

          cat > app/src/main/java/com/greenkisangold/app/MainActivity.java <<'EOF'
          package com.greenkisangold.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.widget.ProgressBar;
          import android.widget.LinearLayout;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(6,59,37));
                  getWindow().setNavigationBarColor(Color.rgb(6,59,37));

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.rgb(6,59,37));

                  ProgressBar progress = new ProgressBar(this);
                  progress.setIndeterminate(true);
                  layout.addView(progress, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 5));

                  webView = new WebView(this);
                  layout.addView(webView, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1));

                  setContentView(layout);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("https://script.google.com/macros/s/AKfycbw1PTkNa46ExD4wrnGLsOB5wnA9LnZbDcmGrP--jQwI6xV0s5EGnTHYtaG0lMLk3Tv8/exec?page=order");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk GREEN-KISAN-GOLD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GREEN-KISAN-GOLD-RELEASE
          path: GREEN-KISAN-GOLD.apk
